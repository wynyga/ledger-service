spring.application.name=ledger-service

# Local database: `docker compose up -d` (see compose.yaml). Override with DB_URL / DB_USER / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/ledger}
spring.datasource.username=${DB_USER:ledger}
spring.datasource.password=${DB_PASSWORD:ledger}
spring.datasource.hikari.maximum-pool-size=20

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus

# Kafka: `docker compose up -d` starts a single broker on localhost:9094. The producer waits for all replicas and
# gives up quickly when the broker is down, so the outbox relay can back off instead of hanging.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# Transactional outbox relay.
ledger.outbox.topic=ledger.transfers
ledger.outbox.relay.enabled=true
ledger.outbox.relay.interval-ms=500
ledger.outbox.relay.batch-size=500

# JWT: base64 HMAC key of at least 32 bytes (e.g. `openssl rand -base64 32`). Empty = random key per start (dev only).
ledger.jwt.secret=${JWT_SECRET:}
ledger.jwt.issuer=ledger-service
ledger.jwt.ttl=15m

# First admin, created at startup when ADMIN_PASSWORD is set. Admins record deposits and run reconciliation.
ledger.admin.username=${ADMIN_USERNAME:admin}
ledger.admin.password=${ADMIN_PASSWORD:}
