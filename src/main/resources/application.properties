spring.application.name=ledger-service

# Local database: `docker compose up -d` (see compose.yaml). Override with DB_URL / DB_USER / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/ledger}
spring.datasource.username=${DB_USER:ledger}
spring.datasource.password=${DB_PASSWORD:ledger}
spring.datasource.hikari.maximum-pool-size=20

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus
